    <circle cx="77" cy="17" r="10" fill="#fff" stroke="#e9c981" stroke-width="4"/>
    <path d="m72 17 4 4 7-8" fill="none" stroke="#ba0c2f" stroke-width="2.7" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="28" y="54" width="40" height="17" rx="3" fill="#29272b"/>
    <circle cx="36" cy="74" r="6" fill="#29272b"/><circle cx="61" cy="74" r="6" fill="#29272b"/>
